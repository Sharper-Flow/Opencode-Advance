name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

jobs:
  baseline-verification:
    name: Baseline verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt violations detected"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Shell verification
        run: |
          bash tests/shell/brand_helpers_test.sh
          bash tests/shell/verification_workflow_test.sh
