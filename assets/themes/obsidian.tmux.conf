# Obsidian Theme — Tmux Status Bar
# OpenCode Advance (oca) managed tmux configuration
#
# Palette:
#   Obsidian     #0B0D10    (deep black, terminal bg)
#   Slate        #1E2228    (status bar bg)
#   Graphite     #2D3138    (borders, separators)
#   Ivory        #E8E6E3    (primary text)
#   Muted Ivory  #A8A6A3    (secondary text)
#   Indigo       #6C7AB8    (accent, active elements)
#   Indigo+      #8B9FE0    (bright accent)

# ── General ──────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
# Cross-device re-entry: do not let a phone-sized client permanently shrink a desktop layout.
set -g window-size latest
set -g escape-time 0
set -g history-limit 10000
set -g mouse on
set -g focus-events on
# When opencode crashes or is killed, close the dead pane (and the auto-empty
# session) instead of letting it linger. Prevents orphan accumulation that
# makes `ps`/`tmux` output confusing and that AI agents may try to "clean up"
# by killing the tmux server PID directly. See docs/design/tmux-server-safety.md.
setw -g remain-on-exit off

# ── Status Bar ───────────────────────────────────────────
set -g status 2
set -g status-interval 10
set -g status-justify left

# Colors
set -g status-style "bg=#1E2228,fg=#E8E6E3"
set -g message-style "bg=#1E2228,fg=#E8E6E3"
set -g message-command-style "bg=#1E2228,fg=#E8E6E3"

# Row 0: session name | git branch | ADV state | host | time
set -g status-format[0] "#(bash $OCA_REPO_ROOT/lib/status_bar.sh row0 '#{session_name}' '#{pane_current_path}' '#{pane_id}')"

# Row 1: compact window glyphs | LLM gauges | date
# For Pattern B sessions with 10+ change windows, use compact index:glyph format.
# Falls back to standard window list for sessions not using glyph rendering.
set -g status-format[1] "#[align=left,bg=#1E2228]\
#(bash $OCA_REPO_ROOT/lib/status_bar.sh row1-windows '#{session_name}' '#{pane_current_path}')\
"

# Active window highlight
set -g window-status-current-style "fg=#6C7AB8,bold"
set -g window-status-style "fg=#A8A6A3"
set -g window-status-separator " "

# ── Pane Borders ─────────────────────────────────────────
set -g pane-border-style "fg=#2D3138"
set -g pane-active-border-style "fg=#6C7AB8"
set -g pane-border-lines single

# ── Copy Mode ────────────────────────────────────────────
set -g mode-style "bg=#2D3138,fg=#E8E6E3"

# ── Clock ────────────────────────────────────────────────
set -g clock-mode-style "bg=#1E2228,fg=#8B9FE0"
set -g clock-mode-colour "#8B9FE0"

# ── Key Bindings ─────────────────────────────────────────
# Prefix+r: restart opencode in current pane (OCA sessions only)
bind r if-shell 'echo "#{session_name}" | grep -q "^oca-"' 'run-shell "oca pane restart-tui"' 'send-keys "r"'
